    <style>
/* --- FOOTER LAYOUT & PALETTE --- */
.adv-tech-footer {
  position: relative;
  background-color: #21212D; /* --tp-common-black-10 */
  overflow: hidden;
  padding-top: 100px;
  font-family: 'Inter', sans-serif;
  color: #fff;
}

#three-footer-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* Gradient to ensure text is readable over particles */
.footer-overlay-gradient {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, transparent 0%, #21212D 90%);
  pointer-events: none;
  z-index: 1;
}

.relative-layer {
  position: relative;
  z-index: 2;
}

/* --- TEXT & LINKS STYLING --- */
.logo-glow {
  transition: 0.3s;
}
.logo-glow:hover {
  filter: drop-shadow(0 0 10px #C1ED00); /* --tp-common-green-regular */
}

.brand-desc {
  color: #b0b0b0;
  font-size: 0.95rem;
  line-height: 1.6;
  margin-top: 20px;
}

.tech-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 30px;
  position: relative;
  display: inline-block;
}

/* Underline with Green */
.tech-title::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 40px;
  height: 3px;
  background: #C1ED00; /* --tp-common-green-regular */
  border-radius: 2px;
}

.tech-links {
  list-style: none;
  padding: 0;
  margin: 0;
}

.tech-links li {
  margin-bottom: 12px;
}

.link-hover-effect {
  color: #cfcfcf;
  text-decoration: none;
  display: inline-block;
  transition: all 0.3s ease;
  position: relative;
  padding-left: 0;
}

.link-hover-effect:hover {
  color: #C1ED00; /* --tp-common-green-regular */
  transform: translateX(10px);
  padding-left: 15px;
}

.link-hover-effect::before {
  content: '>';
  position: absolute;
  left: 0;
  opacity: 0;
  transition: 0.3s;
  color: #43D4A0; /* --tp-common-paste */
  font-weight: bold;
}

.link-hover-effect:hover::before {
  opacity: 1;
}

/* --- SOCIAL BUTTONS --- */
.social-orbit {
  display: flex;
  gap: 15px;
}

.orbit-btn {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}

.orbit-btn:hover {
  background: #C1ED00; /* --tp-common-green-regular */
  color: #21212D;
  border-color: #C1ED00;
  transform: translateY(-5px);
}

/* --- CONTACT ICONS --- */
.info-card-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 20px;
}

.info-icon {
  min-width: 40px;
  height: 40px;
  background: rgba(67, 212, 160, 0.15); /* --tp-common-paste with opacity */
  color: #43D4A0; /* --tp-common-paste */
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15px;
  transition: 0.3s;
}

.info-card-item:hover .info-icon {
  background: #C1ED00; /* --tp-common-green-regular */
  color: #21212D;
  box-shadow: 0 0 15px rgba(193, 237, 0, 0.4);
}

.info-text p, .info-text a {
  color: #cfcfcf;
  margin: 0;
  line-height: 1.5;
  font-size: 0.95rem;
  transition: 0.3s;
  text-decoration: none;
}

.info-text a:hover {
  color: #fff;
}

.mini-links-bar a {
  color: #43D4A0;
  text-decoration: none;
}

.border-tech-top {
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.copyright-txt {
  color: #888;
  font-size: 0.9rem;
}

@media (max-width: 991px) {
  .adv-tech-footer {
    padding-top: 60px;
    text-align: left;
  }
}

<script>
    document.addEventListener('DOMContentLoaded', () => {
  /* 
     -----------------------------------------------------
     CPU OPTIMIZED THREE.JS PARTICLE SYSTEM 
     Uses BufferGeometry for 1 Draw Call per frame.
     -----------------------------------------------------
  */
  const container = document.getElementById('three-footer-container');

  if (!container) return;

  // Scene Setup
  const scene = new THREE.Scene();
  // Fog adds depth and fades particles in the distance
  scene.fog = new THREE.FogExp2(0x21212D, 0.001); 

  const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 1, 1000);
  camera.position.z = 400; // Pull camera back

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false }); // Antialias false for performance
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio > 2 ? 2 : window.devicePixelRatio); // Cap pixel ratio
  container.appendChild(renderer.domElement);

  // --- 1. CREATE CUSTOM CIRCLE TEXTURE (No external image requests) ---
  const getSprite = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    // Radial Gradient for soft glowing dot
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    return new THREE.CanvasTexture(canvas);
  };

  // --- 2. PARTICLE GEOMETRY (BUFFER) ---
  const geometry = new THREE.BufferGeometry();
  
  // Mobile Optimization: Reduce count on small screens
  const isMobile = window.innerWidth < 768;
  const count = isMobile ? 400 : 1000; 

  const positions = [];
  const colors = [];
  
  // Define Palette Colors
  const color1 = new THREE.Color('#C1ED00'); // --tp-common-green-regular
  const color2 = new THREE.Color('#43D4A0'); // --tp-common-paste

  for (let i = 0; i < count; i++) {
    // Spread particles wide
    const x = Math.random() * 1600 - 800;
    const y = Math.random() * 800 - 400;
    const z = Math.random() * 1000 - 500;
    positions.push(x, y, z);

    // Randomly assign one of the two colors
    const color = Math.random() > 0.5 ? color1 : color2;
    colors.push(color.r, color.g, color.b);
  }

  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  // Material setup
  const material = new THREE.PointsMaterial({
    size: 4,
    map: getSprite(),
    vertexColors: true, // Use the colors array we created
    transparent: true,
    opacity: 0.9,
    depthWrite: false, // Performance boost: don't write to depth buffer
    blending: THREE.AdditiveBlending // Glow effect
  });

  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  // --- 3. MOUSE INTERACTION (Parallax) ---
  let mouseX = 0;
  let mouseY = 0;
  let targetX = 0;
  let targetY = 0;

  // Add event listener only on desktop for performance
  if (!isMobile) {
    document.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX - window.innerWidth / 2) * 0.5;
      mouseY = (event.clientY - window.innerHeight / 2) * 0.5;
    });
  }

  // --- 4. ANIMATION LOOP ---
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const elapsedTime = clock.getElapsedTime();

    // 1. Smoothly rotate the entire particle cloud
    particles.rotation.y = elapsedTime * 0.05; 
    particles.rotation.x = elapsedTime * 0.02;

    // 2. Mouse Parallax (Ease towards target)
    targetX = mouseX * 0.001;
    targetY = mouseY * 0.001;
    
    // Smooth camera movement based on mouse
    camera.rotation.y += 0.05 * (targetX - camera.rotation.y);
    camera.rotation.x += 0.05 * (targetY - camera.rotation.x);

    renderer.render(scene, camera);
  }

  animate();

  // --- 5. RESIZE HANDLER ---
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
});
</script>
